<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>EV Charge Grid - Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #000000;
            --foreground: #ffffff;
            --card: #0a0a0a;
            --border: rgba(255, 255, 255, 0.1);
            --muted: #666666;
            --muted-foreground: #a3a3a3;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background: var(--foreground);
            color: var(--background);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--foreground);
        }

        .nav-brand svg {
            width: 20px;
            height: 20px;
        }

        .nav-brand span {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-user {
            font-size: 13px;
            color: var(--muted-foreground);
            padding: 8px 14px;
            border-radius: 9999px;
            border: 1px solid var(--border);
            margin-right: 8px;
        }

        .nav-link {
            font-size: 13px;
            color: var(--muted-foreground);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 9999px;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: var(--foreground);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link.danger:hover {
            color: var(--red);
        }

        /* Main Content */
        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 60px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
        }

        .header-icon svg {
            width: 24px;
            height: 24px;
            color: var(--foreground);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            color: var(--muted-foreground);
            line-height: 1.5;
        }

        /* Card */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
        }

        /* Section */
        .section {
            margin-bottom: 28px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted-foreground);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::before {
            content: '';
            width: 4px;
            height: 4px;
            background: var(--foreground);
            border-radius: 50%;
        }

        /* Battery */
        .battery-display {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .battery-visual {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .battery-bar {
            flex: 1;
            height: 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            padding: 3px;
        }

        .battery-fill {
            height: 100%;
            background: var(--green);
            border-radius: 4px;
            transition: width 0.15s ease, background 0.2s ease;
        }

        .battery-tip {
            width: 4px;
            height: 10px;
            background: var(--border);
            border-radius: 0 2px 2px 0;
        }

        .battery-percent {
            font-size: 24px;
            font-weight: 700;
            min-width: 70px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            transition: color 0.2s ease;
        }

        .battery-percent.low { color: var(--red); }
        .battery-percent.medium { color: var(--yellow); }
        .battery-percent.high { color: var(--green); }

        /* Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--foreground);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
        }

        /* GPS Button */
        .gps-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .gps-button {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .gps-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .gps-button svg {
            width: 20px;
            height: 20px;
            color: var(--foreground);
        }

        .gps-status {
            flex: 1;
            font-size: 14px;
            color: var(--muted-foreground);
            line-height: 1.5;
        }

        .gps-status.success {
            color: var(--green);
        }

        .gps-status.error {
            color: var(--red);
        }

        /* Coordinates Grid */
        .coords-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--muted-foreground);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--foreground);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input::placeholder {
            color: var(--muted);
        }

        .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 16px 24px;
            margin-top: 28px;
            background: var(--foreground);
            color: var(--background);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .submit-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--foreground);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer links */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 32px;
        }

        .footer-link {
            font-size: 13px;
            color: var(--muted-foreground);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--foreground);
        }

        /* Responsive */
        @media (max-width: 480px) {
            nav {
                padding: 0 16px;
            }

            main {
                padding: 80px 16px 40px;
            }

            .card {
                padding: 24px;
            }

            .nav-user {
                display: none;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="/" class="nav-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span>EV Grid</span>
        </a>
        <div class="nav-links">
            <span class="nav-user">{{ username }}</span>
            <a href="/cluster-map" class="nav-link">Cluster Map</a>
            <a href="/logout" class="nav-link danger">Logout</a>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="header">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="10" r="3"></circle>
                        <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"></path>
                    </svg>
                </div>
                <h1>Find Charging Stations</h1>
                <p>Enter your battery level and location to discover reachable EV stations</p>
            </div>

            <div class="card">
                <form method="POST" action="/result">
                    <!-- Battery Section -->
                    <div class="section">
                        <div class="section-label">Battery Level</div>
                        <div class="battery-display">
                            <div class="battery-visual">
                                <div class="battery-bar">
                                    <div class="battery-fill" id="battery-fill" style="width: 50%;"></div>
                                </div>
                                <div class="battery-tip"></div>
                            </div>
                            <div class="battery-percent high" id="battery-percent">50%</div>
                        </div>
                        <input type="range" name="battery_percent" id="battery-slider" min="1" max="100" value="50">
                        <div class="range-labels">
                            <span>1%</span>
                            <span>100%</span>
                        </div>
                    </div>

                    <!-- GPS Section -->
                    <div class="section">
                        <div class="section-label">Your Location</div>
                        <div class="gps-row">
                            <button type="button" class="gps-button" id="gps-btn" title="Detect GPS location">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M12 2v4m0 12v4m10-10h-4M6 12H2"></path>
                                </svg>
                            </button>
                            <div class="gps-status" id="gps-status">Tap to detect your location</div>
                        </div>
                    </div>

                    <!-- Coordinates Section -->
                    <div class="section">
                        <div class="section-label">Coordinates</div>
                        <div class="coords-grid">
                            <div class="input-group">
                                <label>Latitude</label>
                                <input type="number" step="any" id="latitude" name="latitude" placeholder="20.2961" required>
                            </div>
                            <div class="input-group">
                                <label>Longitude</label>
                                <input type="number" step="any" id="longitude" name="longitude" placeholder="85.8245" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        Find Reachable Stations
                    </button>
                </form>
            </div>

            <div class="footer-links">
                <a href="/" class="footer-link">Home</a>
                <a href="/cluster-map" class="footer-link">Network Map</a>
            </div>
        </div>
    </main>

    <script>
        // Battery slider
        const slider = document.getElementById('battery-slider');
        const fill = document.getElementById('battery-fill');
        const percent = document.getElementById('battery-percent');

        function updateBattery(val) {
            val = parseInt(val);
            fill.style.width = val + '%';
            percent.textContent = val + '%';

            percent.classList.remove('low', 'medium', 'high');
            
            if (val < 20) {
                fill.style.background = 'var(--red)';
                percent.classList.add('low');
            } else if (val < 50) {
                fill.style.background = 'var(--yellow)';
                percent.classList.add('medium');
            } else {
                fill.style.background = 'var(--green)';
                percent.classList.add('high');
            }
        }

        slider.addEventListener('input', (e) => updateBattery(e.target.value));

        // GPS detection
        const gpsBtn = document.getElementById('gps-btn');
        const gpsStatus = document.getElementById('gps-status');
        const latInput = document.getElementById('latitude');
        const lonInput = document.getElementById('longitude');

        gpsBtn.addEventListener('click', () => {
            gpsStatus.className = 'gps-status';
            gpsStatus.innerHTML = '<span class="spinner"></span> Detecting location...';

            if (!navigator.geolocation) {
                gpsStatus.className = 'gps-status error';
                gpsStatus.textContent = 'GPS not supported. Enter coordinates manually.';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    latInput.value = pos.coords.latitude.toFixed(6);
                    lonInput.value = pos.coords.longitude.toFixed(6);
                    gpsStatus.className = 'gps-status success';
                    gpsStatus.textContent = 'Location detected: ' + latInput.value + ', ' + lonInput.value;
                },
                () => {
                    gpsStatus.className = 'gps-status error';
                    gpsStatus.textContent = 'GPS denied. Enter coordinates manually.';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });
    </script>
</body>
</html>
