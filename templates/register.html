<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charge Finder — Sign Up</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800;900&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .flashes {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            padding: 0 16px;
        }

        .flash {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .flash.success {
            background: rgba(0, 229, 100, 0.12);
            border: 1px solid rgba(0, 229, 100, 0.3);
            color: #00e564;
        }

        .flash.error {
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.3);
            color: #ff5050;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #111111;
            border-radius: 20px;
            padding: 48px 36px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .brand-icon-dot {
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
        }

        .brand-name {
            font-family: 'Syne', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .brand-sub {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 36px;
        }

        .tabs {
            display: flex;
            width: 100%;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0 12px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab.active {
            color: #ffffff;
            border-bottom-color: #ffffff;
        }

        .tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.6);
        }

        .form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .field-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .input-wrap {
            position: relative;
        }

        .field input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 14px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            appearance: none;
        }

        .field input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .field input:focus {
            border-color: rgba(255, 255, 255, 0.35);
            background: #1f1f1f;
        }

        .field input.pw {
            padding-right: 68px;
            letter-spacing: 0.12em;
        }

        .show-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            transition: color 0.2s;
            padding: 4px;
        }

        .show-btn:hover {
            color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            margin-top: 4px;
        }

        .submit-btn:hover {
            background: #e8e8e8;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin: 4px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .divider-text {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.25);
            white-space: nowrap;
        }

        .oauth-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .oauth-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 16px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        .oauth-btn:hover {
            background: #222222;
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .oauth-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid currentColor;
            flex-shrink: 0;
        }

        .bottom-link {
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
        }

        .bottom-link a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .bottom-link a:hover {
            opacity: 0.7;
        }

        @media (max-width: 440px) {
            .card {
                padding: 40px 24px 32px;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flashes">
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="card">

        <div class="brand-icon">
            <div class="brand-icon-dot"></div>
        </div>

        <h1 class="brand-name">EV Finder</h1>
        <p class="brand-sub">Charging Network Portal</p>

        <div class="tabs">
            <a href="/login" class="tab">Sign In</a>
            <a href="/register" class="tab active">Sign Up</a>
        </div>

        <form class="form" method="POST" action="/register">

            <div class="field">
                <label class="field-label" for="username">Username</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" placeholder="choose_a_username" required
                        autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label class="field-label" for="email">Email Address</label>
                <div class="input-wrap">
                    <input type="email" id="email" name="email" placeholder="you@universe.com" required
                        autocomplete="email">
                </div>
            </div>

            <div class="field">
                <label class="field-label" for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" placeholder="••••••••" class="pw" required
                        autocomplete="new-password">
                    <button type="button" class="show-btn" id="showBtn" onclick="togglePw()">Show</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">Launch Sign Up</button>

            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">or continue with</span>
                <div class="divider-line"></div>
            </div>

            <div class="oauth-row">
                <a href="#" class="oauth-btn">
                    <div class="oauth-dot"></div>
                    Google
                </a>
                <a href="https://github.com/Kaibalya-Mohanty/EV-Charging-Station-Locator" target="_blank"
                    class="oauth-btn">
                    <div class="oauth-dot"></div>
                    GitHub
                </a>
            </div>

        </form>

        <p class="bottom-link">Already have an account? <a href="/login">Sign in</a></p>

    </div>

    <script>
        function togglePw() {
            const input = document.getElementById('password');
            const btn = document.getElementById('showBtn');
            if (input.type === 'password') {
                input.type = 'text';
                input.style.letterSpacing = 'normal';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                input.style.letterSpacing = '0.12em';
                btn.textContent = 'Show';
            }
        }

        setTimeout(() => {
            const flashes = document.querySelector('.flashes');
            if (flashes) { flashes.style.transition = 'opacity 0.5s ease'; flashes.style.opacity = '0'; }
        }, 3000);
    </script>

</body>

</html>
